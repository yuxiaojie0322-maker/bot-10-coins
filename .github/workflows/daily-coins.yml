name: Bot-Hosting Daily Coins

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  claim-coins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run daily coins claimer
        env:
          BOT_HOSTING_TOKEN: ${{ secrets.BOT_HOSTING_TOKEN }}
          NOPECHA_KEY: qifr6gi669wcvuj8iy30rq2j410wfjwm
        run: |
          python daily_coins.py
