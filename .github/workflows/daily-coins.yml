name: Bot-Hosting Daily Coins

on:
  schedule:
    # 北京时间每天早上 09:00 (UTC 01:00)
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  claim-coins:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install requests playwright

      - name: Install Playwright Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Download NopeCHA extension
        run: |
          echo "下载 NopeCHA 插件..."
          mkdir -p scripts/extensions/nopecha/unpacked
          curl -fLo nopecha.zip https://github.com/NopeCHALLC/nopecha-extension/releases/latest/download/chromium.zip
          unzip -q -o nopecha.zip -d scripts/extensions/nopecha/unpacked
          echo "✅ 插件准备就绪"

      - name: Run daily coins claimer (Xvfb 虚拟屏幕)
        env:
          BOT_HOSTING_TOKEN: ${{ secrets.BOT_HOSTING_TOKEN }}
          NOPECHA_KEY: ${{ secrets.NOPECHA_KEY }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" python daily_coins.py

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        if: always()
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1
