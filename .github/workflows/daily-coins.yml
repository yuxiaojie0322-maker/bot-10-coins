name: Bot-Hosting Daily Coins

on:
  schedule:
    # 北京时间每天早上 09:00 (UTC 01:00)，留出 GitHub Actions 调度延迟的余量
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  claim-coins:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. checkout 当前 Public 仓库（仅用于 workflow 文件）
      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          path: public-repo

      # 2. checkout Private 仓库（核心脚本，无 token 参数）
      #    GITHUB_TOKEN 对同账号 Private 仓库有默认读取权限
      - name: Checkout private scripts
        uses: actions/checkout@v4
        with:
          repository: yuxiaojie0322-maker/bh-scripts
          path: private-scripts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (xvfb for headless browser)
        run: |
          apt-get update && apt-get install -y xvfb libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2 --no-install-recommends

      - name: Install Python dependencies
        run: |
          pip install requests playwright

      - name: Install Playwright Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Download NopeCHA extension
        run: |
          echo "下载 NopeCHA 插件..."
          mkdir -p private-scripts/scripts/extensions/nopecha/unpacked
          curl -fLo nopecha.zip https://github.com/NopeCHALLC/nopecha-extension/releases/latest/download/chromium.zip
          unzip -q -o nopecha.zip -d private-scripts/scripts/extensions/nopecha/unpacked
          echo "✅ 插件准备就绪"

      - name: Run daily coins claimer (Xvfb 虚拟屏幕)
        env:
          BOT_HOSTING_TOKEN: ${{ secrets.BOT_HOSTING_TOKEN }}
          NOPECHA_KEY: ${{ secrets.NOPECHA_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          cd private-scripts
          xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" python daily_coins.py

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        if: always()
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1
